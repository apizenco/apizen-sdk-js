name: publish

# A v* tag publishes that version to npm as "apizen", with provenance. Trusted publishing
# (OIDC): npm trusts this workflow of this repository, so no token is stored anywhere.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - name: tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME}" = "v$version" ] || { echo "tag ${GITHUB_REF_NAME}, package.json $version"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
